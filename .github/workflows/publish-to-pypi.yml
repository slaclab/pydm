# This workflow will run when a new release is published and upload it to PyPI using trusted publishing.
# Done in two separate build and publish jobs per suggested best practice for limiting scope of token usage.

name: Publish - PyPI

on:
  release:
    types:
      - published
  workflow_dispatch:
jobs:
  build:
    if: ${{ github.repository == 'slaclab/pydm' }}
    name: Build new release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build Package
      run: python -m build

    - name: Upload package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package
        path: dist/*
        retention-days: 1

  publish:
    needs: build
    if: ${{ github.repository == 'slaclab/pydm' }}
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Used for trusted publishing
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
