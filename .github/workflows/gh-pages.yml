# This workflow will publish a new version of the documentation to the gh-pages branch

name: Publish Documentation

on:
  push:
    branches: [ "master" ]

# Required to push the built docs to the gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    if: ${{ github.repository == 'slaclab/pydm' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          python-version: "3.12"
          miniforge-version: latest
          activate-environment: pydm-docs

      - name: Install python packages
        shell: bash -el {0}
        run: |
          mamba install pydm $(cat docs-requirements.txt)
      - name: Build Docs
        shell: bash -l {0}
        run: |
          pushd docs
          make html
          popd

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
