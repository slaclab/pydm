# Keep SHA-pinned GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    # Wait seven days after release before proposing version updates, allowing time for potential issues to surface.
    cooldown:
      default-days: 7
